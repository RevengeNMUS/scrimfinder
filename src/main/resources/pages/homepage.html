<!DOCTYPE html>
<html>
<head>
    <title>Scrimfinder Homepage</title>
    <link rel="stylesheet" href="homepage-styles.css">
</head>
<body>
<section>
    <div id="site-header">
        <div><a href="amongus.com"><img id="logo-image" src="/plsnolook/scrimfinder-logo-wip.png" alt="Logo"/></a></div>
        <div><a href="amongus.com"><button class="header-box" id="findScrims">Find Scrimmages</button></a></div>
        <div><a href="amongus.com"><button class="header-box" id="login-signup"> Login/Sign Up </button></a></div>
    </div>
    <div id="homepage-container">
        <div class="homepage-section" id="welcome-container">
            Welcome to ScrimFinder
        </div>
        <div class="homepage-section" id="live-container">
            <div id="upcoming-scrims-tag"> Upcoming Scrims </div>
            <div class="scrims-container">
                <div class="scrim-box">
                    <div id="status">status</div>
                    <div id="identifier">TNUMS-CityCityCityCity-DD-MM-YYYY</div>
                    <div id="orgTeam">Org Team: TNUMS</div>
                    <div id="teams">Teams: [N]/[N]</div>
                    <div id="region">Region: [REGION]</div>
                    <div id="city">City: CityCityCityCity</div>
                </div>
            </div>

        </div>
        <div class="homepage-section" id="gallery-contain">
            Gallery
        </div>
    </div>

    <footer id="site-footer">
        <div class="footer-text">Created by Kuriosity Robotics, 12635</div>
        <div class="footer-text">Reach out at <a href="mailto:kuriosityrobotics@gmail.com">kuriosityrobotics@gmail.com</a></div>
    </footer>
</section>
</body>
</html>
