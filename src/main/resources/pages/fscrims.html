<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scrimfinder - Find Scrims</title>
    <link rel="stylesheet" th:href="@{/stylusshockedfaceemoji/find-yumyums.css}"/>
    <script type="module" th:src="@{/jses/gmapes.js}"></script>
</head>
<body th:style="|background-image:url(@{/spoinkydoinks/homepagebackgroundperhaps.png});|">
<section>
    <div id="site-header">
        <div id="site-logo-header">
            <div><a href="/dashboard"><img id="logo-image" th:src="@{/spoinkydoinks/scrimfinder-logo-wip.png}" alt="Logo"/></a></div>
        </div>
        <div id="site-buttons-header">
            <div><a href="amongus.com"><button class="header-box" id="findScrims">Find Scrims</button></a></div>
            <div><a href="amongus.com"><button class="header-box" id="manage-scrims">Manage Scrims</button></a></div>
            <div><a href="amongus.com"><button class="header-box" id="profile">Profile</button></a></div>
        </div>
    </div>
    <div id="homepage-container">
        <div class="homepage-section" id="live-container">
            <div id="search-container" class="inner-container">
                <form id="search-form" role="search">
                    <div id="searchbar">
                        <input id="scrimsearcher" type="text" placeholder="sus it up" name="identifier"> <!--todo: act do good searching you chud :sob:-->
                        <button type="button" id="submitbutton" onclick="igotthescript()">
                            <img id="maglass" th:src="@{/spoinkydoinks/maglass.jpg}" alt="maglass">
                        </button>
                    </div>
                    <div id="filter-bar">
                        <select name="region" id="regions">
                            <option value="" id="ALL">All</option>
                            <option value="NORCAL" id="NORCAL" >Norcal</option>
                            <option value="SOCAL" id="SOCAL">Socal</option>
                        </select>
                        <div id="openfilter">
                            <button type="button" onclick="buttonClicked('openfilterbutton')" id="openfilterbutton" aria-selected="false">
                                Only Open
                            </button>
                        </div>
                    </div>
                </form>
            </div>
            <div class="scrims-container">
            </div>
        </div>
        <div class="homepage-section" id="map">
            <gmp-map center="-25.344,131.031" zoom="4" map-id="8444e43957e825dbbe3e563f">

                <!--<gmp-advanced-marker th:each="scrim : ${scrims}" th:position="|${scrim.location.latitude},${scrim.location.longitude}|" title="My location"></gmp-advanced-marker>-->
            </gmp-map>
        </div>
    </div>
    <footer id="site-footer">
        <div class="footer-text">Created by Kuriosity Robotics, 12635</div>
        <div class="footer-text">Reach out at <a href="mailto:kuriosityrobotics@gmail.com">kuriosityrobotics@gmail.com</a></div>
    </footer>
</section>
</body>
</html>
